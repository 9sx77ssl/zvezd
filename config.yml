# ------------------------------------------------------------------
# Lolz Star Bot — runtime configuration (no secrets here, see .env)
#
# Everything is in plain human units: seconds, minutes, counts.
# ------------------------------------------------------------------

forum:
  # API base url. Env FORUM_BASE_URL overrides this.
  baseUrl: https://api.lolz.team
  # Thread to watch. Env FORUM_THREAD_ID overrides this.
  threadId: 10335815
  # Per-request timeout.
  requestTimeoutMs: 30000
  # `natural_reverse` keeps the pinned first post + newest posts on page 1.
  order: natural_reverse

polling:
  # How often (ms) to check the newest page for new posts.
  intervalMs: 15000
  # Posts per request (max 20).
  pageLimit: 20
  # Pause (ms) between page fetches while walking the backlog.
  pageDelayMs: 5000
  # Pause (ms) after each handled post before moving to the next one.
  postDelayMs: 5000
  # Safety cap for the backlog walk, 0 = unlimited.
  maxBackfillPages: 0
  # Page that carries the newest posts.
  idlePage: 1

pacing:
  # Wait (ms) between sending a star and writing the confirmation comment.
  starToCommentMs: 5000
  # Wait (ms) between the confirmation comment and the ad comment.
  commentToAdMs: 5000
  # Wait (ms) before verifying a star reaction whose send threw.
  starVerifyDelayMs: 2000
  # Wait (ms) before verifying a comment that errored (forum can be slow).
  commentVerifyDelayMs: 3000

balance:
  # While out of stars, how often (ms) to re-check the Telegram balance.
  checkIntervalMs: 60000

star:
  # Stars per post.
  count: 1
  # Env DRY_RUN / `bun run dry` overrides this: simulate, spend nothing.
  dryRun: false

comment:
  enabled: true
  # Substituted into `{text}` of the confirmation comment.
  text: "+\n[IMG=width=100;align=left]https://nztcdn.com/files/90b5834c-80da-44f3-a28c-25a9f29638e3.webp[/IMG]"
  # Placeholders: {user_id} {username} {text} {stars} {link}
  template: '[user="{user_id}"]{username}[/user], {text}'
  # Sent instead of the usual confirmation when the channel disabled paid reactions.
  paidReactionsDisabledText: 'у вас выключены платные реакции, включите их и приходите еще!'
  # Sent when a bare channel link is submitted but the channel has no posts.
  noPostsFoundText: 'не нашёл пост в канале, скиньте ссылку на конкретный пост!'
  # Second comment under every post — an advertisement. Fully configurable.
  ad:
    enabled: true
    template: |-
      [ad=align=center][B][tooltip=5]Zelenka[/tooltip] Work  — задания за деньги[/B]

      Подписки, отзывы, регистрации, комментарии — от 2 до 60 ₽ за штуку.
      Больше 150 активных заданий, новые появляются каждый день.
      Вывод от 1000 ₽: карта, крипта, СБП или Steam через [URL='https://lzt.market']lzt.market[/URL] .

      [URL='https://zelenka.work/?ref=lolz_cucumber'][B]zelenka.work[/B][/URL][B]  [/B][/ad]

rateLimit:
  # Forum GET budget per minute (server allows 300). Keep a margin.
  readPerMinute: 240
  # Forum POST budget per minute (server allows 30). Keep a margin.
  writePerMinute: 20

retry:
  # Max attempts for a request before giving up.
  attempts: 3
  # Base retry delay (ms); grows exponentially with jitter.
  delayMs: 1000
  # Ceiling for retry delays (ms).
  maxDelayMs: 30000
  # After a post exhausts its attempts, wait this long before trying again.
  cooldownMs: 3600000

database:
  # Env DB_PATH overrides this.
  path: ./data/star.db

auth:
  # File holding FORUM_TOKEN (re-read while the forum answers 401).
  envPath: .env
  # How often (ms) to re-read that file / probe the forum after a 401.
  checkIntervalMs: 60000
  # Repeat the "still waiting for a token" log every N checks (0 = never).
  logEveryChecks: 10

stats:
  # Live stats thread on the forum (edited every minute).
  enabled: true
  # Thread whose title + first post are rewritten with live stats.
  threadId: 10345229
  # How often to refresh the stats page.
  intervalMs: 60000
  # `{date}` is replaced with e.g. "26.09.28 13:12 UTC".
  titleTemplate: 'Razda4a zvezd stats / updated at {date}'
  links:
    # Per-user spoiler with the channel links they submitted and overlap flags.
    enabled: true

telegram:
  # Env TG_SESSION_PATH overrides this.
  sessionPath: ./data/tg.session

logging:
  level: info
  pretty: true
