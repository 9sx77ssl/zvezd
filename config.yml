# ------------------------------------------------------------------
# zvezd — рабочая конфигурация (секреты в .env, не здесь).
# Всё поведение настраивается здесь; .env хранит только ключи.
# Все длительности — в миллисекундах, если не сказано иначе.
# ------------------------------------------------------------------

forum:
  # Адрес API форума.
  baseUrl: https://api.lolz.team
  # Тема, которую следим.
  threadId: 10335815
  # Таймаут одного запроса, мс.
  requestTimeoutMs: 30000
  # Порядок постов: natural_reverse = закреплённый первый пост + новые сверху.
  order: natural_reverse

polling:
  # Как часто проверять новые посты, мс.
  intervalMs: 15000
  # Постов за один запрос (максимум 20).
  pageLimit: 20
  # Пауза между запросами страниц при обходе беклога, мс.
  pageDelayMs: 5000
  # Максимум страниц при первичном обходе беклога, 0 = без лимита.
  maxBackfillPages: 0

pacing:
  # Общая пауза между любыми действиями: звезда, комментарии, правки, мс.
  cooldownMs: 6000
  # Ожидание перед проверкой звезды, если её отправка упала, мс.
  starVerifyDelayMs: 2000
  # Ожидание перед проверкой комментария, если запрос упал, мс.
  commentVerifyDelayMs: 3000

balance:
  # Как часто проверять баланс звёзд, пока их не хватает, мс.
  checkIntervalMs: 60000

star:
  # Сколько звёзд ставить на пост.
  count: 1
  # Режим симуляции без трат (запуск: `bun run dry`).
  dryRun: false

comment:
  # Включены ли комментарии бота (подтверждение и уведомления).
  enabled: true
  # Текст, который подставляется в {text} шаблона ниже.
  text: "+\n[IMG=width=100;align=left]https://nztcdn.com/files/90b5834c-80da-44f3-a28c-25a9f29638e3.webp[/IMG]"
  # Шаблон комментария. Плейсхолдеры: {user_id} {username} {text} {stars} {link}.
  template: '[user="{user_id}"]{username}[/user], {text}'
  # Уведомление: у канала отключены платные реакции.
  paidReactionsDisabledText: 'у вас выключены платные реакции, включите их и приходите еще!'
  # Уведомление: в канале нет постов.
  noPostsFoundText: 'не нашёл пост в канале, скиньте ссылку на конкретный пост!'
  # Уведомление: в посте нет валидной ссылки на Telegram.
  noLinkFoundText: 'не нашёл ссылку в посте, скиньте ссылку на канал или конкретный пост!'
  # Уведомление: ссылку не удалось открыть.
  linkUnresolvableText: 'не смог открыть ссылку, проверьте её и скиньте ещё раз!'
  # Второй комментарий под постом — реклама. Полностью настраивается.
  ad:
    # Включена ли реклама.
    enabled: true
    # Шаблон рекламы (те же плейсхолдеры, что у шаблона выше).
    template: |-
      [ad=align=center][B][tooltip=5]Zelenka[/tooltip] Work  — задания за деньги[/B]

      Подписки, отзывы, регистрации, комментарии — от 2 до 60 ₽ за штуку.
      Больше 150 активных заданий, новые появляются каждый день.
      Вывод от 1000 ₽: карта, крипта, СБП или Steam через [URL='https://lzt.market']lzt.market[/URL] .

      [URL='https://zelenka.work/?ref=lolz_cucumber'][B]zelenka.work[/B][/URL][B]  [/B][/ad]

rateLimit:
  # Лимит GET-запросов к форуму в минуту (сервер разрешает 300).
  readPerMinute: 240
  # Лимит POST/PUT-запросов к форуму в минуту (сервер разрешает 30).
  writePerMinute: 20

retry:
  # Сколько попыток даётся одному HTTP-запросу.
  attempts: 3
  # Базовая задержка повтора, мс (растёт экспоненциально с джиттером).
  delayMs: 1000
  # Максимальная задержка повтора, мс.
  maxDelayMs: 30000
  # Пауза перед повтором поста, исчерпавшего все попытки, мс.
  failedPostCooldownMs: 3600000

database:
  # Путь к базе SQLite.
  path: ./data/star.db

auth:
  # Файл с FORUM_TOKEN (перечитывается, когда форум отвечает 401).
  tokenFile: .env
  # Как часто перечитывать токен и проверять форум, мс.
  tokenCheckIntervalMs: 60000
  # Раз в сколько проверок писать «всё ещё ждём токен» (0 = никогда).
  logEveryChecks: 10

stats:
  # Включена ли живая страница статистики на форуме.
  enabled: true
  # Тема, у которой переписываются заголовок и первый пост.
  threadId: 10345229
  # Как часто обновлять статистику, мс.
  intervalMs: 60000
  # {date} заменяется на дату вида «26.09.28 13:12 UTC».
  titleTemplate: 'Razda4a zvezd stats / updated at {date}'
  links:
    # Спойлер со ссылками каналов и пересечениями по каждому юзеру.
    enabled: true

telegram:
  # Путь к файлу сессии Telegram (создаётся `bun run login`). Держи в секрете.
  sessionPath: ./data/tg.session

logging:
  # Уровень логов: trace/debug/info/warn/error/fatal.
  level: info
  # Человекочитаемый вывод логов.
  pretty: true
